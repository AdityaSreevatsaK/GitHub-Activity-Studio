name: Developer World prototype

on:
  pull_request:
    paths:
      - 'concepts/developer-world/**'
      - '.github/workflows/developer-world.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-world:
    name: Tests and exports (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: concepts/developer-world
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline unit and HTTP integration tests
        run: npm test
      - name: Generate GitHub-compatible SVG files
        run: npm run export
      - name: Verify all exported SVG variants
        run: node tests/verify-exports.cjs
      - name: Render browser screenshots (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          node server.cjs > "$RUNNER_TEMP/developer-world-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/concepts/developer-world/index.html > /dev/null; then break; fi
            sleep 1
          done
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome" || { echo 'Chrome/Chromium is unavailable'; exit 1; }
          mkdir -p screenshots
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1280,930 --virtual-time-budget=4500 --screenshot="$PWD/screenshots/archipelago-showcase.png" "http://127.0.0.1:8787/?sample=showcase&layout=archipelago&theme=dark"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1280,930 --virtual-time-budget=4500 --screenshot="$PWD/screenshots/village-showcase.png" "http://127.0.0.1:8787/?sample=showcase&layout=village&theme=light"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --dump-dom "http://127.0.0.1:8787/?sample=showcase&layout=archipelago&theme=dark" > screenshots/archipelago-dom.html
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --dump-dom "http://127.0.0.1:8787/?sample=showcase&layout=village&theme=light" > screenshots/village-dom.html
          node -e "const fs=require('fs');const a=fs.readFileSync('screenshots/archipelago-showcase.png'),b=fs.readFileSync('screenshots/village-showcase.png');for(const p of [a,b]){if(p.length<15000||p.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw Error('Screenshot invalid');}if(a.equals(b))throw Error('Different worlds rendered identical screenshots');for(const [name,title] of [['archipelago','The Isles of Code'],['village','The Little Buildtown']]){const h=fs.readFileSync('screenshots/'+name+'-dom.html','utf8');if((h.match(/data-date=/g)||[]).length!==371||!h.includes('212 active dates')||!h.includes(title))throw Error(name+' did not render the showcase calendar correctly');console.log(name,'rendered 371 date cells and 212 active dates');}"
      - name: Verify real GIF export in headless Chrome
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 4
        run: node tests/browser-gif-smoke.cjs
      - name: Upload browser screenshots for review
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: developer-world-browser-screenshots
          path: concepts/developer-world/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload sample exports for design review
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: developer-world-svg-previews
          path: concepts/developer-world/exports/*.svg
          if-no-files-found: error
          retention-days: 7
