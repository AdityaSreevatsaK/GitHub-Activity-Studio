<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 376" width="1200" height="376" role="img" aria-labelledby="metroTitle metroDesc">
<title id="metroTitle">Open Source Metro, modern dark visualisation</title>
<desc id="metroDesc">Synthetic demo metro map. Repositories are stations; five colour-coded lines represent commits, pull requests opened, pull requests merged, issues opened, and releases. Animated trains replay recorded events in UTC timestamp order. Lines show shared event types, not repository dependencies.</desc>
<defs><style><![CDATA[
.headline{font:700 28px system-ui,sans-serif;letter-spacing:1.3px;fill:#EAF5FA}
.kicker{font:700 10px system-ui,sans-serif;letter-spacing:3px;fill:#94A9BD}
.station{font:600 14px system-ui,sans-serif;fill:#EAF5FA}
.small{font:600 9px system-ui,sans-serif;letter-spacing:1px;fill:#94A9BD}
.line-name{font:700 11px system-ui,sans-serif;letter-spacing:1px;fill:#EAF5FA}
.detail{font:500 10px system-ui,sans-serif;fill:#94A9BD}
.stop:focus{outline:none}.stop:focus .focus-ring{stroke-width:4;opacity:1}
@media (prefers-reduced-motion:reduce){.train,.pulse{display:none}}
]]></style></defs>
<rect width="1200" height="376" fill="#0B1724"/>
<rect x="18" y="18" width="1164" height="340" rx="14" fill="#102335" stroke="#2A4052" stroke-width="1.5"/>
